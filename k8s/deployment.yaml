apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentry-pod
  namespace: secure-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentry-pod
  template:
    metadata:
      labels:
        app: sentry-pod
    spec:
      containers:
        - name: sentry-pod
          image: 072337753870.dkr.ecr.us-east-1.amazonaws.com/sentry-pod:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"